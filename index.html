<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL 訓練記錄</title>
<style>
  :root{
    --bg:#0C0C11; --panel:#16161F; --panel-2:#0F0F16; --line:#2A2A3A;
    --text:#F5F5FF; --dim:#9C9CB8; --dimmer:#63637E;
    --dayA:#FF8A3D; --dayB:#5C9EFF; --dayC:#82D94F; --day:#FF8A3D;
    --up:#3DDC84; --down:#FB7185;
    --warn:#FACC15; --warn-line:#6B5A1C; --warn-bg:#241F0E;
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;
       line-height:1.5;padding:0 0 110px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px}

  .hero{background:linear-gradient(150deg,color-mix(in oklab,var(--day) 78%,#000),color-mix(in oklab,var(--day) 40%,#000));
       margin:0 -16px;padding:26px 20px 18px;border-radius:0 0 24px 24px}
  .hero .k{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.75);text-transform:uppercase}
  .hero h1{font-size:44px;font-weight:900;margin:2px 0 0;letter-spacing:-.02em;color:#fff;line-height:1.05}
  .hero h1 small{font-size:16px;font-weight:800;letter-spacing:.12em;margin-left:10px;color:rgba(255,255,255,.85)}
  .streak{margin-top:12px;display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;font-weight:700}
  .dots{display:flex;gap:5px}
  .dots i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.28)}
  .dots i.f{background:#fff}
  .who{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;
       color:rgba(255,255,255,.55);margin-top:12px}
  .who button{background:none;border:none;color:rgba(255,255,255,.75);font-family:var(--mono);
       font-size:11px;text-decoration:underline;cursor:pointer;padding:0}

  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
  .tab{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 0;
       font-size:16px;font-weight:900;color:var(--dim);font-family:inherit;letter-spacing:.1em;
       cursor:pointer;transition:border-color .15s,color .15s}
  .tab[aria-selected="true"]{border-color:var(--c);color:#fff;
       background:linear-gradient(160deg,color-mix(in oklab,var(--c) 22%,var(--panel)),var(--panel))}

  .daterow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px;gap:12px}
  .daterow label{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--dimmer)}
  input[type=date]{background:var(--panel);border:2px solid var(--line);color:var(--text);
       border-radius:12px;padding:9px 12px;font-family:var(--mono);font-size:14px;font-weight:700}

  .ex{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin:12px 0;overflow:hidden}
  .ex-h{display:flex;gap:12px;padding:16px 16px 0;align-items:flex-start}
  .mach{width:88px;height:68px;flex:0 0 88px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px}
  .ex-t{flex:1;min-width:0}
  .ex-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .ex-zh{font-weight:900;font-size:18px}
  .ex-en{font-family:var(--mono);font-size:10.5px;color:var(--dimmer);letter-spacing:.04em;margin-top:2px}
  .ex-target{font-family:var(--mono);font-size:11px;color:var(--dim);white-space:nowrap}
  .ex-id{font-size:12.5px;color:var(--dim);margin-top:6px;line-height:1.45}
  .ex-id b{color:var(--day);font-weight:700}

  .big{display:flex;align-items:baseline;gap:12px;padding:12px 16px 0}
  .big .w{font-family:var(--mono);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
  .big .w small{font-size:14px;color:var(--dim);font-weight:600;margin-left:2px}
  .delta{font-weight:900;font-size:15px;border-radius:999px;padding:4px 12px;border:1px solid var(--line);color:var(--dimmer)}
  .delta.up{background:rgba(61,220,132,.14);border-color:rgba(61,220,132,.4);color:var(--up)}
  .delta.down{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.35);color:var(--down)}
  .delta.same{color:var(--dim)}
  .sub{font-size:12px;color:var(--dim);padding:4px 16px 0}
  .spark{display:block;width:calc(100% - 32px);height:52px;margin:4px 16px 0}

  .col-h{display:grid;grid-template-columns:26px 1fr 1fr;gap:9px;padding:12px 16px 6px}
  .col-h span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--dimmer)}
  .sets{padding:0 16px 6px;display:grid;gap:9px}
  .set{display:grid;grid-template-columns:26px 1fr 1fr;gap:9px;align-items:center}
  .set-n{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:center;font-weight:700}
  .field{position:relative}
  .field input{width:100%;background:var(--panel-2);border:2px solid var(--line);border-radius:12px;height:54px;
       padding:0 40px 0 14px;color:var(--text);font-family:var(--mono);font-size:20px;font-weight:700}
  .field input:focus{outline:none;border-color:var(--day)}
  .field input::placeholder{color:#3A3A50}
  .field .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--mono);
       font-size:11px;color:var(--dimmer);pointer-events:none}
  .done{margin:2px 16px 0;font-size:13px;font-weight:800;color:var(--up);display:none}
  .done.show{display:block}
  .padend{height:14px}

  details.alt{border-top:1px solid var(--line);background:var(--panel-2);margin-top:10px}
  details.alt summary{list-style:none;cursor:pointer;padding:11px 16px;font-family:var(--mono);
       font-size:11px;letter-spacing:.12em;color:var(--dim);display:flex;justify-content:space-between;align-items:center}
  details.alt summary::-webkit-details-marker{display:none}
  details.alt summary::after{content:"＋";color:var(--dimmer)}
  details.alt[open] summary::after{content:"−"}
  .alt-body{padding:0 16px 14px;font-size:13.5px;color:var(--dim)}
  .alt-body ul{margin:0;padding-left:18px}
  .alt-body li{margin:0 0 5px}
  .alt-body .why{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dimmer)}

  .savebar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);
       padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .savebar .inner{max-width:448px;margin:0 auto;display:flex;gap:10px}
  button.save{flex:1;color:#fff;border:none;border-radius:16px;padding:18px;font-size:18px;font-weight:900;
       font-family:inherit;letter-spacing:.05em;cursor:pointer;
       background:linear-gradient(120deg,color-mix(in oklab,var(--day) 80%,#000),color-mix(in oklab,var(--day) 55%,#000));
       box-shadow:0 6px 24px color-mix(in oklab,var(--day) 35%,transparent)}
  button.ghost{background:var(--panel);color:var(--dim);border:2px solid var(--line);border-radius:16px;
       padding:18px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--panel);
       border:2px solid var(--day);color:var(--text);padding:10px 18px;border-radius:999px;font-size:13px;
       font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,bottom .2s}
  .toast.show{opacity:1;bottom:104px}

  .banner{margin:14px 0 0;padding:12px 14px;border:1px solid var(--warn-line);background:var(--warn-bg);
       border-radius:14px;font-size:13px;color:var(--warn);line-height:1.5;white-space:pre-wrap;font-weight:600}
  .hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .hist-head h2{margin:0}
  .syncstat{font-family:var(--mono);font-size:11px;color:var(--dimmer);margin-left:auto;text-align:right}
  .syncstat.busy{color:var(--day)}
  .syncstat.ok{color:var(--up)}
  .syncstat.bad{color:var(--down)}
  .hist{margin:22px 0 0}
  .hist h2{font-size:13px;font-weight:900;letter-spacing:.15em;color:var(--dim);margin:0}
  .hist-item{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
       margin-bottom:8px;font-family:var(--mono);font-size:12px;color:var(--dim)}
  .hist-item .d{color:var(--text);font-weight:700;font-size:13px;margin-bottom:3px}
  .empty{color:var(--dimmer);font-size:13px;padding:14px 0}

  .foot{margin:26px 0 0;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--panel);
       font-size:13px;color:var(--dim)}
  .foot h3{font-size:14px;font-weight:900;margin:0 0 8px;color:var(--text)}
  .foot ul{margin:0;padding-left:18px}
  .foot li{margin-bottom:5px}
  .loading{color:var(--dimmer);font-family:var(--mono);font-size:12px;padding:20px 0}
  .editex{margin:14px 0 0;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;
       font-size:13.5px;color:var(--dim)}
  .editex summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.15em;
       color:var(--dimmer);text-transform:uppercase}
  .editrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line)}
  .editrow input[type=checkbox]{accent-color:var(--day);width:17px;height:17px}
  .editrow .rm{margin-left:auto;background:none;border:1px solid var(--line);color:var(--dim);
       border-radius:8px;padding:4px 10px;font-size:12px;cursor:pointer}
  .addrow{display:flex;gap:8px;margin-top:10px}
  .addrow input{flex:1;min-width:0;background:var(--panel-2);border:2px solid var(--line);
       border-radius:10px;padding:10px;color:var(--text);font-size:14px;font-family:inherit}
  .addrow button{background:color-mix(in oklab,var(--day) 75%,#000);border:none;color:#fff;border-radius:10px;
       padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer}
  .timer{position:fixed;right:16px;bottom:112px;z-index:50;border:none;color:#fff;border-radius:999px;
       padding:13px 20px;font-family:var(--mono);font-size:17px;font-weight:800;cursor:pointer;
       background:linear-gradient(120deg,color-mix(in oklab,var(--day) 80%,#000),color-mix(in oklab,var(--day) 55%,#000));
       box-shadow:0 6px 20px color-mix(in oklab,var(--day) 40%,transparent)}
  .timer.run{}
  /* RWD: mobile-first; wider screens keep ONE card per row, just more air */
  @media (min-width:768px){
    .wrap{max-width:560px}
    .hero h1{font-size:52px}
    .savebar .inner{max-width:528px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:360px){.mach{width:76px;flex:0 0 76px;height:60px}.hero h1{font-size:38px}}
  /* ---- 登入畫面 ---- */
  .gate{max-width:380px;margin:14vh auto;padding:0 20px;text-align:center}
  .gate h1{font-size:32px;font-weight:900;margin:0 0 6px}
  .gate p{color:var(--dim);font-size:13.5px;margin:0 0 22px;line-height:1.6}
  .gate input{width:100%;background:var(--panel);border:2px solid var(--line);border-radius:12px;
       padding:14px;color:var(--text);font-size:16px;font-family:inherit;margin-bottom:10px}
  .gate input:focus{outline:none;border-color:var(--day)}
  .gate button{width:100%;color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;
       font-weight:900;font-family:inherit;cursor:pointer;
       background:linear-gradient(120deg,color-mix(in oklab,var(--day) 80%,#000),color-mix(in oklab,var(--day) 55%,#000))}
  .gate button:disabled{opacity:.5}
  .gate .msg{margin-top:14px;font-size:13px;color:var(--dim);line-height:1.6;min-height:20px}
  .gate .msg.ok{color:var(--up)}
  .gate .msg.bad{color:var(--down)}
</style>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312161D'/%3E%3Crect x='6' y='29' width='52' height='6' rx='3' fill='%2398A2B0'/%3E%3Crect x='12' y='14' width='8' height='36' rx='3' fill='%23FF8A3D'/%3E%3Crect x='22' y='20' width='7' height='24' rx='3' fill='%235C9EFF'/%3E%3Crect x='35' y='20' width='7' height='24' rx='3' fill='%235C9EFF'/%3E%3Crect x='44' y='14' width='8' height='36' rx='3' fill='%2382D94F'/%3E%3C/svg%3E">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ar" markerWidth="6" markerHeight="6" refX="4.5" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="var(--day)"/>
  </marker>
</defs></svg>

<!-- 登入畫面 -->
<div class="gate" id="gate" hidden>
  <h1>訓練記錄</h1>
  <p>輸入 Email，我們寄一個登入連結給你。<br>不用設密碼，點信裡的連結就進得來。</p>
  <input type="email" id="email" placeholder="you@example.com" autocomplete="email" inputmode="email">
  <button id="sendlink">寄登入連結</button>
  <div class="msg" id="gatemsg"></div>
</div>

<!-- 主畫面 -->
<div id="app" hidden>
  <div class="wrap">
    <header class="hero">
      <div class="k">90-DAY 訓練家之路</div>
      <h1 id="herotitle">推<small>PUSH DAY</small></h1>
      <div class="streak"><span id="weekstat">本週道館 – / 3</span>
        <div class="dots" id="weekdots"><i></i><i></i><i></i></div></div>
      <div class="who"><span id="whoami"></span><button id="logout">登出</button></div>
    </header>

    <div id="banner" class="banner" hidden></div>
    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="daterow">
      <label for="date">訓練日期</label>
      <input type="date" id="date">
    </div>

    <div id="list"><div class="loading">載入中…</div></div>

    <details class="editex">
      <summary>編輯動作清單</summary>
      <div id="editbody"></div>
    </details>

    <div class="hist">
      <div class="hist-head">
        <h2>冒險紀錄</h2>
        <span class="syncstat" id="syncstat"></span>
      </div>
      <div id="hist"></div>
    </div>

    <div class="foot">
      <h3>認機器的三個問題</h3>
      <ul>
        <li><b>坐的方向？</b>面向椅背還是背靠椅背 —— 蝴蝶機和反向蝴蝶機常是同一台，只差在這裡。</li>
        <li><b>墊子壓在哪？</b>大腿上方、腳踝後方、大腿外側，位置決定它練哪裡。</li>
        <li><b>往哪個方向出力？</b>推出去、拉回來、往上、往外，這個不會因廠牌改變。</li>
      </ul>
    </div>
  </div>

  <div class="savebar"><div class="inner">
    <button class="save" id="save">收服今日訓練！</button>
    <button class="ghost" id="clear">清空</button>
  </div></div>
  <button class="timer" id="timer" hidden></button>
</div>
<div class="toast" id="toast"></div>

/* ---------- Custom exercise list (user_settings.days) ---------- */
const emptyPrefs = () => ({A:{hidden:[],custom:[]},B:{hidden:[],custom:[]},C:{hidden:[],custom:[]}});
let prefs = emptyPrefs();
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* the exercises actually shown for a day: defaults minus hidden, plus customs */
function exList(k){
  const p = prefs[k] || {};
  return DAYS[k].ex.filter(e => !(p.hidden||[]).includes(e.zh))
    .concat((p.custom||[]).map(zh => ({zh, en:"", target:"", icon:"_custom", id:"", alt:[], why:""})));
}

/* Only allow saving prefs after a successful load — otherwise an upsert of the
   in-memory defaults would wipe the customization stored on the server. */
let prefsLoaded = false;
async function loadPrefs(){
  const { data, error } = await sb.from("user_settings").select("days").maybeSingle();
  if(error) return;                 // prefsLoaded stays false, edits are blocked
  if(data && data.days) prefs = {...emptyPrefs(), ...data.days};
  prefsLoaded = true;
}
async function savePrefs(){
  if(!prefsLoaded) await loadPrefs();   // one retry before giving up
  if(!prefsLoaded){ showBanner("動作清單尚未載入，暫時無法修改。請檢查連線後重新整理。"); return; }
  const { error } = await sb.from("user_settings")
    .upsert({ user_id: user.id, days: prefs, updated_at: new Date().toISOString() });
  if(error) showBanner("動作清單儲存失敗：" + error.message);
}

/* weekly training count (distinct dates since Monday) for the hero streak */
async function loadWeek(){
  const now = new Date(), mon = new Date(now);
  mon.setDate(now.getDate() - (now.getDay()+6)%7);
  const p = n => String(n).padStart(2,"0");
  const ms = mon.getFullYear()+"-"+p(mon.getMonth()+1)+"-"+p(mon.getDate());
  const { data, error } = await sb.from("workout_logs").select("log_date").gte("log_date", ms).limit(500);
  if(error) return;
  const n = new Set((data||[]).map(r=>r.log_date)).size;
  $("weekstat").textContent = "本週道館 "+n+" / 3";
  $("weekdots").innerHTML = [0,1,2].map(i=>'<i class="'+(i<n?"f":"")+'"></i>').join("");
}

/* ---------- Rest timer: filling in a weight = set done, start the clock ---------- */
const REST_SECONDS = 70;  // ponytail: fixed midpoint of the 60-75s target; make it a setting if it ever matters
let restTick = null;
function startRest(){
  clearInterval(restTick);
  let left = REST_SECONDS;
  const el = $("timer");
  const fmt = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.hidden = false; el.classList.add("run");
  el.textContent = fmt(left);
  restTick = setInterval(()=>{
    left--;
    if(left > 0){ el.textContent = fmt(left); return; }
    clearInterval(restTick);
    el.classList.remove("run");
    el.textContent = "體力全滿，上！";
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(()=>{ if(!el.classList.contains("run")) el.hidden = true; }, 5000);
  }, 1000);
}
$("timer").onclick = ()=>{ clearInterval(restTick); $("timer").hidden = true; $("timer").classList.remove("run"); };

/* ---------- 讀取：只會拿到自己的資料，RLS 在資料庫端擋掉別人的 ---------- */
async function loadDay(k){
  setStat("讀取中…","busy");
  const { data, error } = await sb
    .from("workout_logs")
    .select("log_date, exercise, set_no, weight, reps, note")
    .eq("day_key", k)
    .order("log_date",{ascending:false})
    .order("set_no",{ascending:true})
    .limit(200);

  if(error){ setStat("讀取失敗","bad"); showBanner("讀取失敗："+error.message); ready=true; render(); return; }

  const byDate = {};
  (data||[]).forEach(r=>{
    if(!byDate[r.log_date]) byDate[r.log_date] = exList(k).map(()=>[null,null,null]);
    const i = exList(k).findIndex(e=>e.zh===r.exercise);
    if(i<0 || r.set_no>3) return;
    byDate[r.log_date][i][r.set_no-1] = {w:String(r.weight), r:String(r.reps==null?"":r.reps)};
  });
  state[k] = Object.keys(byDate).sort().map(d=>({date:d, data:byDate[d]}));
  ready = true; render();
  setStat(state[k].length ? ("已載入 "+state[k].length+" 次紀錄") : "還沒有紀錄", "ok");
}

/* ---------- Offline queue: failed saves wait in localStorage until we're back online ---------- */
const PENDING_KEY = "ppl_pending";
const getPending = () => JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
const setPending = a => a.length
  ? localStorage.setItem(PENDING_KEY, JSON.stringify(a))
  : localStorage.removeItem(PENDING_KEY);
const isNetErr = e => !navigator.onLine || /fetch|network/i.test(e.message || "");

function queuePending(date, dayKey, rows){
  const rest = getPending().filter(p => !(p.date === date && p.day === dayKey));
  setPending([...rest, {date, day: dayKey, rows}]);
  setStat("已暫存，恢復連線自動補送", "busy");
  toast("沒有網路 — 已暫存 " + date + "，恢復連線會自動補送");
}

/* delete-then-insert, same strategy as a normal save; returns error or null */
async function writeSession(date, dayKey, rows){
  const del = await sb.from("workout_logs").delete()
    .eq("log_date", date).eq("day_key", dayKey);
  if(del.error) return del.error;
  const ins = await sb.from("workout_logs").insert(rows);
  return ins.error;
}

let flushing = false;
async function flushPending(){
  if(flushing || !user) return;
  let q = getPending();
  if(!q.length) return;
  flushing = true;
  let sent = 0;
  while(q.length){
    const err = await writeSession(q[0].date, q[0].day, q[0].rows);
    if(err && isNetErr(err)) break;   // still offline — retry on next 'online'
    if(err){                          // permanent error: drop it, tell the user, keep flushing the rest
      showBanner("離線紀錄補送失敗（" + q[0].date + " Day " + q[0].day + "）：" + err.message + "\n請重新填寫這天的紀錄。");
    } else sent++;
    q = q.slice(1); setPending(q);
  }
  flushing = false;
  if(sent){ toast("已補送 " + sent + " 筆離線紀錄"); await loadDay(day); }
}
window.addEventListener("online", flushPending);

/* ---------- 儲存：先刪掉這天這個分項，再寫入現在的內容 ---------- */
async function saveSession(date){
  const rows = [];
  exList(day).forEach((e,i)=>{
    [0,1,2].forEach(n=>{
      const w = $("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="w"]').value;
      const r = $("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="r"]').value;
      if(!w) return;
      rows.push({ user_id:user.id, log_date:date, day_key:day, exercise:e.zh,
                  set_no:n+1, weight:parseFloat(w), reps: r ? parseInt(r,10) : null });
    });
  });
  if(!rows.length){ toast("還沒填任何重量"); return; }

  setStat("儲存中…","busy");
  const err = await writeSession(date, day, rows);
  if(err){
    if(isNetErr(err)){ queuePending(date, day, rows); return; }
    setStat("儲存失敗","bad"); showBanner("儲存失敗："+err.message); return;
  }

  // this save supersedes any queued offline copy of the same date/day
  setPending(getPending().filter(p => !(p.date === date && p.day === day)));
  $("banner").hidden = true;
  toast("已儲存 "+date);
  await loadDay(day);
  loadWeek();
}

$("save").onclick = ()=> saveSession($("date").value || todayStr());
$("clear").onclick = ()=>{
  $("list").querySelectorAll("input").forEach(i=>{ if(i.dataset.f==="w") i.value=""; });

  toast("已清空輸入欄");
};

    d.mo+' '+d.name+' '+k+'</button>').join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>{
    b.onclick = async ()=>{ day=b.dataset.day; ready=false; render();
      window.scrollTo({top:0,behavior:"smooth"}); await loadDay(day); };
  });
}
const lastSession = () => state[day].length ? state[day][state[day].length-1] : null;
function bestOf(sets){
  const v=(sets||[]).filter(s=>s&&s.w); if(!v.length) return null;
  return v.reduce((a,b)=> parseFloat(b.w)>parseFloat(a.w)?b:a);
}

/* Progress sparkline: best-set weight per session, last 10 sessions.
   Single series in the day color; last point direct-labeled; dots carry
   native <title> tooltips. Needs >=2 sessions to be a trend. */
function sparkline(i){
  const pts = state[day]
    .map(s => ({d: s.date, b: bestOf(s.data[i])}))
    .filter(p => p.b)
    .map(p => ({d: p.d, w: parseFloat(p.b.w)}))
    .slice(-10);
  if(pts.length < 2) return "";
  const W=280, H=56, PX=8, PY=12, LABEL=38;
  const min = Math.min(...pts.map(p=>p.w)), max = Math.max(...pts.map(p=>p.w));
  const x = k => PX + k*(W-2*PX-LABEL)/(pts.length-1);
  const y = w => max===min ? H/2 : PY + (H-2*PY)*(1-(w-min)/(max-min));
  const last = pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet" '+
    'role="img" aria-label="'+esc(exList(day)[i].zh)+' 重量趨勢，最近 '+pts.length+' 次">'+
    '<path d="'+pts.map((p,k)=>(k?"L":"M")+x(k).toFixed(1)+","+y(p.w).toFixed(1)).join(" ")+'"'+
    ' stroke="var(--day)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map((p,k)=>'<circle cx="'+x(k).toFixed(1)+'" cy="'+y(p.w).toFixed(1)+'" r="4" fill="var(--day)">'+
      '<title>'+p.d+'　'+p.w+' kg</title></circle>').join("")+
    '<text x="'+(x(pts.length-1)+9).toFixed(1)+'" y="'+(y(last.w)+4).toFixed(1)+'"'+
    ' fill="var(--dim)" font-size="12" font-family="var(--mono)">'+last.w+'kg</text></svg>';
}

function render(){
  const d = DAYS[day];
  document.documentElement.style.setProperty("--day", d.color);
  $("herotitle").innerHTML = d.mo+' '+d.name+'<small>'+d.st+'</small>';
  renderTabs();
  if(!ready){ $("list").innerHTML = '<div class="loading">載入中…</div>'; return; }
  const prev = lastSession();

  $("list").innerHTML = exList(day).map((e,i)=>{
    const p = prev ? bestOf(prev.data[i]) : null;
    const bigTxt = p
      ? '<div class="big"><span class="w">'+p.w+'<small>kg</small></span>'+
        '<span class="delta" data-i="'+i+'">今天？</span></div>'+
        '<div class="sub">上次最重 '+p.w+' kg × '+(p.r||"–")+' 下，今天的目標是超過它</div>'
      : '<div class="big"><span class="w">–<small>kg</small></span></div>'+
        '<div class="sub">尚無紀錄，今天先試出一個 RIR 2 的重量</div>';
    return '<div class="ex"><div class="ex-h">'+ICONS[e.icon]+
      '<div class="ex-t"><div class="ex-top"><div><div class="ex-zh">'+esc(e.zh)+'</div>'+
      (e.en?'<div class="ex-en">'+e.en+'</div>':'')+'</div>'+
      (e.target?'<div class="ex-target">'+e.target+'</div>':'')+'</div>'+
      (e.id?'<div class="ex-id">'+e.id+'</div>':'')+'</div></div>'+
      bigTxt+sparkline(i)+
      '<div class="col-h"><span></span><span>重量</span><span>次數</span></div><div class="sets">'+
      [1,2,3].map(n=>'<div class="set"><div class="set-n">'+n+'</div>'+
        '<div class="field"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="'+
          (p?p.w:"–")+'" data-ex="'+i+'" data-set="'+(n-1)+'" data-f="w"><span class="u">kg</span></div>'+
        '<div class="field"><input type="number" inputmode="numeric" step="1" min="0" value="10"'+
          ' data-ex="'+i+'" data-set="'+(n-1)+'" data-f="r"><span class="u">下</span></div>'+
        '</div>').join("")+'</div>'+
      '<div class="done" data-i="'+i+'">進化了！比上次更強</div>'+
      (e.alt.length?'<details class="alt"><summary>找不到這台？替代動作</summary><div class="alt-body"><ul>'+
      e.alt.map(a=>'<li>'+a+'</li>').join("")+'</ul><div class="why">'+e.why+'</div></div></details>':'<div class="padend"></div>')+'</div>';
  }).join("");

  $("list").querySelectorAll("input[data-f='w']").forEach(inp=>{
    inp.addEventListener("input", ()=>updateDelta(inp.dataset.ex));
    inp.addEventListener("change", ()=>{ if(inp.value) startRest(); });
  });
  renderHist();
  renderEdit();
}

/* ---------- Edit the exercise list: hide defaults, add/remove customs ---------- */
function renderEdit(){
  const p = prefs[day] || (prefs[day] = {hidden:[], custom:[]});
  $("editbody").innerHTML =
    DAYS[day].ex.map(e =>
      '<label class="editrow"><input type="checkbox" data-zh="'+esc(e.zh)+'"'+
      ((p.hidden||[]).includes(e.zh)?'':' checked')+'> '+esc(e.zh)+'</label>').join("")+
    (p.custom||[]).map(zh =>
      '<div class="editrow">'+esc(zh)+'（自訂）<button class="rm" data-zh="'+esc(zh)+'">移除</button></div>').join("")+
    '<div class="addrow"><input id="newex" maxlength="20" placeholder="新增自訂動作，如：腿內收機">'+
    '<button id="addex">新增</button></div>';

  $("editbody").querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.onchange = async ()=>{
      const zh = cb.dataset.zh;
      p.hidden = cb.checked ? (p.hidden||[]).filter(x=>x!==zh) : [...(p.hidden||[]), zh];
      await savePrefs(); await loadDay(day);
    };
  });
  $("editbody").querySelectorAll(".rm").forEach(b=>{
    b.onclick = async ()=>{
      p.custom = (p.custom||[]).filter(x=>x!==b.dataset.zh);
      await savePrefs(); await loadDay(day);   // logged sets stay in the DB, just not shown
    };
  });
  $("addex").onclick = async ()=>{
    const zh = $("newex").value.trim();
    if(!zh) return;
    if(DAYS[day].ex.some(e=>e.zh===zh) || (p.custom||[]).includes(zh)){ toast("已經有這個動作了"); return; }
    p.custom = [...(p.custom||[]), zh];
    await savePrefs(); await loadDay(day);
  };
}

function updateDelta(i){
  const chip = $("list").querySelector('.delta[data-i="'+i+'"]'); if(!chip) return;
  const prev = lastSession(); const p = prev ? bestOf(prev.data[i]) : null; if(!p) return;
  const vals=[...$("list").querySelectorAll('input[data-ex="'+i+'"][data-f="w"]')]
    .map(x=>parseFloat(x.value)).filter(v=>!isNaN(v));
  const done = $("list").querySelector('.done[data-i="'+i+'"]');
  if(!vals.length){ chip.className="delta"; chip.textContent="今天？";
    if(done) done.classList.remove("show"); return; }
  const diff = Math.max(...vals) - parseFloat(p.w);
  if(diff>0){ chip.className="delta up"; chip.textContent="↑ +"+(+diff.toFixed(1)); }
  else if(diff===0){ chip.className="delta same"; chip.textContent="持平"; }
  else { chip.className="delta down"; chip.textContent="↓ "+(+diff.toFixed(1)); }
  if(done) done.classList.toggle("show", diff>0);
}

function renderHist(){
  const arr=[...state[day]].reverse().slice(0,6);
  if(!arr.length){ $("hist").innerHTML='<div class="empty">還沒有 Day '+day+' 的紀錄。</div>'; return; }
  $("hist").innerHTML = arr.map(s=>{
    const lines = exList(day).map((e,i)=>{
      const sets=(s.data[i]||[]).filter(x=>x&&x.w).map(x=>x.w+"×"+(x.r||"?")).join("  ");
      return sets ? esc(e.zh)+" &nbsp;"+sets : null;
    }).filter(Boolean);
    return '<div class="hist-item"><div class="d">'+s.date+'</div>'+lines.join("<br>")+'</div>';
  }).join("");
}
</script>
