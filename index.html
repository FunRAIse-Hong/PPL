<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPL 訓練記錄</title>
<meta name="description" content="健身房現場用的訓練記錄：每個器械動作上次推多少、今天的目標重量，三組填完就存。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600&family=Red+Hat+Text:wght@400;500;700&family=Red+Hat+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Hallmark · shape: app screen · genre: modern-minimal · theme: Furrow (by request) · redesign: full
 * nav: kept, a one-line bar over the day tabs · signature: the goal ledger as a ruled record, and each card's target on a notebook-grid well · states: loading, empty, error banner, offline queue · furrow: no survey map (app screen), flat keys (the user dislikes moulded buttons)
 * axes: light/grotesk-sans/warm · posture: committed · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H5 E4 S4 R5 V4 · weakest: S, the survey map is the theme's signature and an app screen has no hero for it; the notebook grid under the target carries the material instead */
/* Hallmark · dropped the three day colours (fire, water, grass) and the dark-only rule · the user chose Furrow; tangerine fills, green means earned */
/* Hallmark · dropped the ramp line "30 → 32.5 → 35 kg" under the target · 69 names it; the three weight placeholders already say it */
/* Hallmark · reworded "本週 – / 3" to "本週", "–" to "…" and "⚠️" to "注意：" · 19 and 11 name them */
/* Hallmark · reworded "——" in the machine notes and the offline toast to a comma or colon; dropped 🔥 from three toasts · 19 and 11 name them */
:root{
  color-scheme:light;
  --space-3xs:2px; --space-2xs:4px; --space-xs:8px; --space-sm:12px; --space-md:16px; --space-lg:24px; --space-xl:40px; --space-2xl:64px; --space-3xl:96px; --space-4xl:144px;
  --text-xs:0.8125rem; --text-sm:0.9375rem; --text-md:1rem; --text-lg:1.25rem; --text-xl:1.5rem; --text-2xl:2rem; --text-3xl:2.5rem; --text-4xl:3rem;
  --text-reading:3.5rem;
  --ease-out:cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro:120ms; --dur-short:220ms; --dur-long:420ms;
  --z-sticky:200; --z-toast:500;
  --color-paper:oklch(96% 0.011 85); --color-paper-2:oklch(99.5% 0.005 85); --color-paper-3:oklch(92% 0.016 85);
  --color-ink:oklch(18% 0.006 60); --color-ink-2:oklch(28% 0.008 60); --color-muted:oklch(44% 0.012 60);
  --color-rule:oklch(88% 0.013 85); --color-rule-2:oklch(18% 0.006 60);
  --color-accent:oklch(70% 0.19 40); --color-accent-ink:oklch(18% 0.006 60); --color-accent-deep:oklch(60% 0.19 40);
  --color-focus:oklch(60% 0.19 40); --color-slot:oklch(62% 0.07 58); --color-grid:oklch(90% 0.014 85);
  --color-ok:oklch(48% 0.11 150); --color-ok-soft:oklch(92% 0.04 150); --color-bad:oklch(52% 0.17 27); --color-bad-soft:oklch(94% 0.03 27);
  --font-display:"Red Hat Display",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-body:"Red Hat Text",-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --font-outlier:"Red Hat Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --radius-card:6px; --rule-hair:1px; --rule-bar:2px;
  --tracking-display:-0.035em;
  --wrap:500px; --wrap-wide:580px; --field-h:56px; --key-h:56px; --mach-w:96px; --mach-h:74px; --goal-cols:24px minmax(0,1fr) 3.25rem 5rem;
}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:clip}
html{scrollbar-color:var(--color-rule) var(--color-paper)}
body{margin:0;padding:0 0 var(--space-4xl);background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);
  font-size:var(--text-md);line-height:1.55;-webkit-font-smoothing:antialiased;caret-color:var(--color-ink)}
::selection{background:var(--color-accent);color:var(--color-ink)}
:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:800;font-synthesis:none;letter-spacing:var(--tracking-display);text-transform:uppercase;
  line-height:1.02;overflow-wrap:break-word;min-width:0;text-wrap:balance;color:var(--color-ink)}
button,input{font:inherit}
[hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--space-md)}

/* the bar */
.bar{display:flex;align-items:center;gap:var(--space-sm);padding-block:var(--space-md);font-size:var(--text-sm);color:var(--color-muted)}
.bar .mark{font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;text-transform:uppercase;color:var(--color-ink);margin-right:auto;white-space:nowrap}
#whoami{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link{background:none;border:0;padding:var(--space-2xs) 0;color:var(--color-muted);cursor:pointer;
  text-decoration:underline;text-decoration-color:transparent;text-underline-offset:.2em;text-decoration-thickness:2px;
  transition:color var(--dur-micro) var(--ease-out),text-decoration-color var(--dur-micro) var(--ease-out)}
.link:active{color:var(--color-ink)}

/* day tabs: three blocks, the chosen one on volt */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-xs);margin-top:var(--space-sm)}
.tab{border:var(--rule-bar) solid var(--color-ink);background:transparent;color:var(--color-ink);border-radius:var(--radius-card);padding:var(--space-sm) 0;
  font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;text-transform:uppercase;line-height:1.25;cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out)}
.tab[aria-selected="true"]{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
.tab:active{background:var(--color-paper-3)}

/* the board: the sheet opens on a bar rule */
.board{margin-top:var(--space-2xl);border-top:var(--rule-bar) solid var(--color-rule-2);border-bottom:var(--rule-bar) solid var(--color-rule-2)}
.board-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:var(--space-sm) var(--space-md);padding:var(--space-lg) 0}
.board-h h1{font-size:var(--text-3xl)}
.week{display:flex;align-items:center;gap:var(--space-xs);font-size:var(--text-sm);font-weight:500;color:var(--color-muted);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:var(--space-2xs)}
.dots i{width:20px;height:8px;border-radius:1px;background:var(--color-paper-3);border:1px solid var(--color-rule)}
.dots i.f{background:var(--color-ink);border-color:var(--color-ink)}
.goals-h,.grow{display:grid;grid-template-columns:var(--goal-cols);gap:var(--space-md);align-items:center;padding:var(--space-sm) 0}
.goals-h{font-size:var(--text-xs);font-weight:500;color:var(--color-muted);border-top:var(--rule-hair) solid var(--color-rule)}
.goals-h span:nth-child(n+3){text-align:right}
.goals:empty{display:none}
.grow{width:100%;padding-block:var(--space-md);background:none;border:0;border-top:var(--rule-hair) solid var(--color-rule);color:var(--color-ink);
  text-align:left;cursor:pointer;transition:background-color var(--dur-micro) var(--ease-out)}
.grow:active{background:var(--color-paper-2)}
.gmark{width:24px;height:24px;border-radius:2px;border:var(--rule-bar) solid var(--color-ink);display:grid;place-items:center;
  font-size:var(--text-xs);font-weight:700;color:transparent;transition:background-color var(--dur-short) var(--ease-out),border-color var(--dur-short) var(--ease-out)}
.grow.hit .gmark{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);animation:pop .35s var(--ease-out)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.gname{min-width:0;font-size:var(--text-lg);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glast{font-family:var(--font-outlier);font-size:var(--text-md);font-weight:500;color:var(--color-muted);text-align:right;font-variant-numeric:tabular-nums}
.gtarget{font-family:var(--font-display);font-size:var(--text-xl);font-weight:800;line-height:1;color:var(--color-ink);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.gtarget small{font-family:var(--font-body);font-size:var(--text-xs);font-weight:500;color:var(--color-muted);margin-left:var(--space-3xs)}
.grow.hit .gname,.grow.hit .glast,.grow.hit .gtarget{color:var(--color-muted)}
.daterow{display:flex;align-items:center;justify-content:space-between;gap:var(--space-sm);padding:var(--space-lg) 0;border-top:var(--rule-hair) solid var(--color-rule)}
.daterow label{font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
input[type=date]{background:var(--color-paper);border:var(--rule-hair) solid var(--color-rule);color:var(--color-ink);border-radius:var(--radius-card);
  padding:var(--space-xs) var(--space-sm);font-family:var(--font-outlier);font-size:var(--text-md);font-weight:500;font-variant-numeric:tabular-nums}

.banner{margin-top:var(--space-md);padding:var(--space-sm) var(--space-md);border-left:var(--rule-bar) solid var(--color-bad);background:var(--color-bad-soft);
  border-radius:var(--radius-card);font-size:var(--text-sm);color:var(--color-ink);white-space:pre-wrap}

/* exercise sections: a bar rule opens each, no box */
#list{margin-top:var(--space-2xl)}
.ex{margin-top:var(--space-3xl);border-top:var(--rule-bar) solid var(--color-rule-2)}
.ex:first-child{margin-top:0}
.ex-h{display:flex;gap:var(--space-lg);padding-top:var(--space-lg);align-items:flex-start;cursor:pointer}
.ex.fold>:not(.ex-h){display:none}
.ex.fold .ex-h{padding-bottom:var(--space-md)}
.ex.fold .ex-zh::after{content:" ✓";color:var(--color-ok)}
.mach{width:var(--mach-w);height:var(--mach-h);flex:0 0 var(--mach-w);background:var(--color-paper-2);border-radius:var(--radius-card)}
.ex-t{flex:1;min-width:0}
.ex-top{display:flex;justify-content:space-between;gap:var(--space-xs);align-items:baseline}
.ex-zh{font-family:var(--font-display);font-size:var(--text-xl);font-weight:800;line-height:1.15}
.ex-en{font-size:var(--text-xs);font-weight:500;color:var(--color-muted);margin-top:var(--space-3xs)}
.ex-target{font-family:var(--font-outlier);font-size:var(--text-sm);font-weight:500;color:var(--color-muted);white-space:nowrap}
.ex-id{font-size:var(--text-sm);color:var(--color-ink-2);margin-top:var(--space-sm);line-height:1.65}
.ex-id b{font-weight:700}

.reading{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,36%);grid-template-areas:"big spark" "sub sub";
  column-gap:var(--space-md);align-items:end;margin-top:var(--space-xl);padding:var(--space-lg);background:var(--color-paper-2);border-radius:var(--radius-card)}
.big{grid-area:big;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--space-sm);row-gap:var(--space-2xs)}
.big .glabel{flex-basis:100%;font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
.big .w{font-family:var(--font-display);font-size:var(--text-reading);font-weight:800;line-height:.9;color:var(--color-ink);font-variant-numeric:tabular-nums}
.big .w small{font-family:var(--font-body);font-size:var(--text-lg);font-weight:500;color:var(--color-muted);margin-left:var(--space-2xs)}
.big .w-none{font-size:var(--text-2xl)}
.delta{font-family:var(--font-outlier);font-size:var(--text-sm);font-weight:500;padding:var(--space-3xs) var(--space-xs);border-radius:var(--radius-card);
  border:var(--rule-hair) solid var(--color-rule);color:var(--color-muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.delta.up{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink)}
.delta.down{background:var(--color-bad-soft);border-color:var(--color-bad-soft);color:var(--color-bad)}
.delta.same{color:var(--color-ink)}
.sub{grid-area:sub;padding-top:var(--space-md);font-size:var(--text-sm);color:var(--color-ink-2);font-variant-numeric:tabular-nums}
.sub span{white-space:nowrap}
.sparkrow{grid-area:spark;position:relative;height:48px;padding-right:var(--space-xl)}
.spark{display:block;width:100%;height:100%}
.sparklabel{position:absolute;right:0;font-family:var(--font-outlier);font-size:var(--text-xs);font-weight:500;color:var(--color-ink);font-variant-numeric:tabular-nums;line-height:1}

.col-h,.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr);gap:var(--space-sm);align-items:center}
.col-h{padding:var(--space-xl) 0 var(--space-sm);font-size:var(--text-xs);font-weight:500;color:var(--color-muted)}
.sets{display:grid;gap:var(--space-md);padding-bottom:var(--space-md)}
.set-n{font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;color:var(--color-muted);text-align:center}
.field{position:relative}
.field input{width:100%;height:var(--field-h);background:var(--color-paper);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);
  padding:0 var(--space-xl) 0 var(--space-md);color:var(--color-ink);font-family:var(--font-outlier);font-size:var(--text-xl);font-weight:500;
  font-variant-numeric:tabular-nums;transition:border-color var(--dur-micro) var(--ease-out)}
.field input::placeholder{color:var(--color-slot)}
.field .u{position:absolute;right:var(--space-sm);top:50%;transform:translateY(-50%);font-size:var(--text-xs);font-weight:500;color:var(--color-muted);pointer-events:none}
.done{margin-top:var(--space-xs);padding:var(--space-xs) var(--space-md);border-radius:var(--radius-card);background:var(--color-accent);
  font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;text-transform:uppercase;color:var(--color-accent-ink)}
.done:not(.show){display:none}
.done.show{animation:rise var(--dur-long) var(--ease-out)}
@keyframes rise{from{opacity:0;transform:translateY(4px)}}
.padend{height:var(--space-md)}

/* disclosures share one chevron */
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:var(--space-sm);
  transition:color var(--dur-micro) var(--ease-out)}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:8px;height:8px;flex:0 0 8px;margin-right:var(--space-2xs);border-right:2px solid currentColor;border-bottom:2px solid currentColor;
  transform:translateY(-2px) rotate(45deg);transition:transform var(--dur-short) var(--ease-out)}
details[open]>summary::after{transform:translateY(2px) rotate(-135deg)}
details.alt{margin-top:var(--space-lg);border-top:var(--rule-hair) solid var(--color-rule)}
details.alt summary{padding:var(--space-md) 0;font-size:var(--text-sm);font-weight:500;color:var(--color-ink-2)}
.alt-body{padding-bottom:var(--space-md);font-size:var(--text-sm);color:var(--color-ink-2)}
.alt-body ul,.foot ul{margin:0;padding-left:var(--space-lg)}
.alt-body li,.foot li{margin-bottom:var(--space-2xs)}
.alt-body .why{margin-top:var(--space-sm);padding-top:var(--space-sm);border-top:var(--rule-hair) solid var(--color-rule);color:var(--color-muted)}

/* history: results sheet */
.hist{margin-top:var(--space-3xl)}
.hist-head{display:flex;align-items:center;gap:var(--space-sm);padding-bottom:var(--space-sm);border-bottom:var(--rule-bar) solid var(--color-rule-2)}
.hist h2{font-size:var(--text-2xl)}
.syncstat{margin-left:auto;font-size:var(--text-xs);font-weight:500;color:var(--color-muted);text-align:right}
.syncstat.busy{color:var(--color-ink)}
.syncstat.ok{color:var(--color-ok)}
.syncstat.bad{color:var(--color-bad)}
.hist-item{padding:var(--space-lg) 0;border-bottom:var(--rule-hair) solid var(--color-rule);font-family:var(--font-outlier);font-size:var(--text-sm);
  line-height:1.75;color:var(--color-ink-2);font-variant-numeric:tabular-nums}
.hist-item .d{font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;color:var(--color-ink);margin-bottom:var(--space-2xs)}
.empty{color:var(--color-muted);font-size:var(--text-sm);padding:var(--space-md) 0}
.loading{color:var(--color-muted);font-size:var(--text-sm);padding:var(--space-lg) 0}

/* reference: two rows on the bar rule */
.panels{margin-top:var(--space-2xl);border-top:var(--rule-bar) solid var(--color-rule-2);border-bottom:var(--rule-bar) solid var(--color-rule-2);color:var(--color-ink)}
.panels>details+details{border-top:var(--rule-hair) solid var(--color-rule)}
.panels summary{padding:var(--space-lg) 0;font-family:var(--font-display);font-size:var(--text-lg);font-weight:800;text-transform:uppercase;color:var(--color-ink)}
.panels details>div,.foot ul{padding-bottom:var(--space-md);font-size:var(--text-sm);color:var(--color-ink-2)}
.foot ul{padding-left:var(--space-lg)}
.editrow{display:flex;align-items:center;gap:var(--space-sm);padding:var(--space-sm) 0;border-bottom:var(--rule-hair) solid var(--color-rule);color:var(--color-ink)}
.editrow input[type=checkbox]{accent-color:var(--color-ink);width:20px;height:20px;margin:0}
.editrow .rm{margin-left:auto}
.addrow{display:flex;gap:var(--space-xs);margin-top:var(--space-md)}
.addrow input{flex:1;min-width:0;height:44px;background:var(--color-paper);border:var(--rule-hair) solid var(--color-rule);border-radius:var(--radius-card);
  padding:0 var(--space-sm);color:var(--color-ink)}
.addrow input::placeholder{color:var(--color-muted)}
.ver{margin:var(--space-xl) 0;text-align:center;font-family:var(--font-outlier);font-size:var(--text-xs);color:var(--color-muted);font-variant-numeric:tabular-nums}

/* the control pair: volt block, ink-bordered block */
.btn-p,.btn-s,.sharebtn,button.ghost{border-radius:var(--radius-card);font-family:var(--font-display);font-weight:800;text-transform:uppercase;cursor:pointer;
  transition:background-color var(--dur-micro) var(--ease-out),color var(--dur-micro) var(--ease-out)}
.btn-p{background:var(--color-accent);border:var(--rule-bar) solid var(--color-accent);color:var(--color-accent-ink)}
.btn-s,.sharebtn,button.ghost{background:transparent;border:var(--rule-bar) solid var(--color-ink);color:var(--color-ink)}
.btn-p:active{background:var(--color-accent-deep);border-color:var(--color-accent-deep)}
.btn-s:active,.sharebtn:active,button.ghost:active{background:var(--color-paper-3)}
.btn-p:disabled,.btn-s:disabled{opacity:.6;cursor:not-allowed}
.btn-s,.sharebtn{padding:var(--space-2xs) var(--space-sm);font-size:var(--text-md)}
.addrow .btn-p{height:44px;padding:0 var(--space-md);font-size:var(--text-md)}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sticky);background:var(--color-paper);border-top:var(--rule-bar) solid var(--color-rule-2);
  padding:var(--space-sm) var(--space-md) max(var(--space-md),env(safe-area-inset-bottom))}
.savebar .inner{max-width:calc(var(--wrap) - 2 * var(--space-md));margin-inline:auto;display:flex;gap:var(--space-sm)}
button.save{flex:1;height:var(--key-h);font-size:var(--text-xl)}
button.ghost{height:var(--key-h);padding:0 var(--space-lg);font-size:var(--text-lg)}
.timer{position:fixed;right:var(--space-md);top:max(var(--space-sm),env(safe-area-inset-top));z-index:var(--z-toast);
  padding:var(--space-xs) var(--space-md);font-family:var(--font-outlier);font-size:var(--text-xl);font-weight:500;text-transform:none;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(var(--key-h) + var(--space-xl));z-index:var(--z-toast);transform:translate(-50%,8px);opacity:0;pointer-events:none;
  background:var(--color-ink);color:var(--color-paper);padding:var(--space-xs) var(--space-md);
  border-radius:var(--radius-card);font-size:var(--text-sm);white-space:nowrap;
  transition:opacity var(--dur-short) var(--ease-out),transform var(--dur-short) var(--ease-out)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Furrow: sentence case, 600 heads, tangerine as a fill only, green for earned */
h1,h2,h3,.bar .mark,.tab,.done,.panels summary,.btn-p,.btn-s,.sharebtn,button.ghost{text-transform:none;font-weight:600}
.ex-zh,.gtarget,.big .w,.set-n,.hist-item .d{font-weight:600}
.tab{border-width:1px;border-color:var(--color-rule);background:var(--color-paper-2);font-family:var(--font-body);font-weight:500}
.tab[aria-selected="true"]{background:var(--color-accent);border-color:var(--color-accent);color:var(--color-accent-ink);font-weight:600}

.gmark{border-width:1px;border-color:var(--color-muted);border-radius:50%}
.grow.hit .gmark{background:var(--color-ok);border-color:var(--color-ok);color:var(--color-paper-2)}

.delta.up{background:var(--color-ok-soft);border-color:var(--color-ok-soft);color:var(--color-ok)}
.done{background:var(--color-ok-soft);color:var(--color-ok);font-family:var(--font-body);font-size:var(--text-sm);font-weight:500}
.field input{background:var(--color-paper-2);border-color:var(--color-muted)}
.board-h h1{letter-spacing:var(--tracking-display)}
@media (hover:hover){
  .link:hover{color:var(--color-ink);text-decoration-color:var(--color-accent-deep)}

  .grow:hover{background:var(--color-paper-2)}
  details.alt summary:hover,.panels summary:hover{color:var(--color-accent-deep)}
  .field input:hover,.addrow input:hover{border-color:var(--color-muted)}

}
@media (min-width:768px){

@media (max-width:360px){

/* machine diagrams: the arrow redraws along the force direction; parts tagged .mv slide the same way (--mx/--my), one 2s loop */
.mach path[marker-end]{stroke-dasharray:80;animation:machdraw 2s ease-in-out infinite}
@keyframes machdraw{0%{stroke-dashoffset:80}55%,100%{stroke-dashoffset:0}}
.mach .mv{animation:machmove 2s ease-in-out infinite}
@keyframes machmove{0%,100%{transform:translate(0,0)}45%,62%{transform:translate(var(--mx,8px),var(--my,0px))}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
  .mach path[marker-end]{stroke-dasharray:none}
}

/* ---------- Custom exercise list (user_settings.days) ---------- */
const emptyPrefs = () => ({A:{hidden:[],custom:[]},B:{hidden:[],custom:[]},C:{hidden:[],custom:[]}});
let prefs = emptyPrefs();
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* the exercises actually shown for a day: defaults minus hidden, plus customs */
function exList(k){
  const p = prefs[k] || {};
  return DAYS[k].ex.filter(e => !(p.hidden||[]).includes(e.zh))
    .concat((p.custom||[]).map(zh => ({zh, en:"", target:"", icon:"_custom", id:"", alt:[], why:""})));
}

/* Only allow saving prefs after a successful load — otherwise an upsert of the
   in-memory defaults would wipe the customization stored on the server. */
let prefsLoaded = false;
async function loadPrefs(){
  if(DEMO) return;
  const { data, error } = await sb.from("user_settings").select("days").maybeSingle();
  if(error) return;                 // prefsLoaded stays false, edits are blocked
  if(data && data.days) prefs = {...emptyPrefs(), ...data.days};
  prefsLoaded = true;
}
async function savePrefs(){
  if(!prefsLoaded) await loadPrefs();   // one retry before giving up
  if(!prefsLoaded){ showBanner("動作清單尚未載入，暫時無法修改。請檢查連線後重新整理。"); return; }
  const { error } = await sb.from("user_settings")
    .upsert({ user_id: user.id, days: prefs, updated_at: new Date().toISOString() });
  if(error) showBanner("動作清單儲存失敗：" + error.message);
}

/* ---------- Rest timer: filling in a weight = set done, start the clock ---------- */
const REST_SECONDS = 70;  // ponytail: fixed midpoint of the 60-75s target; make it a setting if it ever matters
let restTick = null;
function startRest(){
  clearInterval(restTick);
  let left = REST_SECONDS;
  const el = $("timer");
  const fmt = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  el.hidden = false; el.classList.add("run");
  el.textContent = fmt(left);
  restTick = setInterval(()=>{
    left--;
    if(left > 0){ el.textContent = fmt(left); return; }
    clearInterval(restTick);
    el.classList.remove("run");
    el.textContent = "體力全滿，上！";
    if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(()=>{ if(!el.classList.contains("run")) el.hidden = true; }, 5000);
  }, 1000);
}

/* ---------- 讀取：只會拿到自己的資料，RLS 在資料庫端擋掉別人的 ---------- */
async function loadDay(k){
  if(DEMO){ state[k] = demoState(k); ready = true; render(); setStat("預覽資料","ok"); return; }
  setStat("讀取中…","busy");
  const { data, error } = await sb
    .from("workout_logs")
    .select("log_date, exercise, set_no, weight, reps, note")
    .eq("day_key", k)
    .order("log_date",{ascending:false})
    .order("set_no",{ascending:true})
    .limit(200);

  if(error){ setStat("讀取失敗","bad"); showBanner("讀取失敗："+error.message); ready=true; render(); return; }

  const byDate = {};
  (data||[]).forEach(r=>{
    if(!byDate[r.log_date]) byDate[r.log_date] = exList(k).map(()=>[null,null,null]);
    const i = exList(k).findIndex(e=>e.zh===r.exercise);
    if(i<0 || r.set_no>3) return;
    byDate[r.log_date][i][r.set_no-1] = {w:String(r.weight), r:String(r.reps==null?"":r.reps)};
  });
  state[k] = Object.keys(byDate).sort().map(d=>({date:d, data:byDate[d]}));
  ready = true; render();
  setStat(state[k].length ? ("已載入 "+state[k].length+" 次紀錄") : "還沒有紀錄", "ok");
}

/* ---------- Offline queue: failed saves wait in localStorage until we're back online ---------- */
const PENDING_KEY = "ppl_pending";
const getPending = () => JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
const setPending = a => a.length
  ? localStorage.setItem(PENDING_KEY, JSON.stringify(a))
  : localStorage.removeItem(PENDING_KEY);
const isNetErr = e => !navigator.onLine || /fetch|network/i.test(e.message || "");

function queuePending(date, dayKey, rows){
  const rest = getPending().filter(p => !(p.date === date && p.day === dayKey));
  setPending([...rest, {date, day: dayKey, rows}]);
  setStat("已暫存，恢復連線自動補送", "busy");
  toast("沒有網路，已暫存 " + date + "，恢復連線會自動補送");
}

/* delete-then-insert, same strategy as a normal save; returns error or null */
async function writeSession(date, dayKey, rows){
  const del = await sb.from("workout_logs").delete()
    .eq("log_date", date).eq("day_key", dayKey);
  if(del.error) return del.error;
  const ins = await sb.from("workout_logs").insert(rows);
  return ins.error;
}

let flushing = false;
async function flushPending(){
  if(flushing || !user) return;
  let q = getPending();
  if(!q.length) return;
  flushing = true;
  let sent = 0;
  while(q.length){
    const err = await writeSession(q[0].date, q[0].day, q[0].rows);
    if(err && isNetErr(err)) break;   // still offline — retry on next 'online'
    if(err){                          // permanent error: drop it, tell the user, keep flushing the rest
      showBanner("離線紀錄補送失敗（" + q[0].date + " Day " + q[0].day + "）：" + err.message + "\n請重新填寫這天的紀錄。");
    } else sent++;
    q = q.slice(1); setPending(q);
  }
  flushing = false;
  if(sent){ toast("已補送 " + sent + " 筆離線紀錄"); await loadDay(day); }
}
window.addEventListener("online", flushPending);

/* ---------- 儲存：先刪掉這天這個分項，再寫入現在的內容 ---------- */
async function saveSession(date){
  if(DEMO){ toast("預覽模式，儲存已停用"); return; }
  const rows = [];
  exList(day).forEach((e,i)=>{
    [0,1,2].forEach(n=>{
      const w = $("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="w"]').value;
      const r = $("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="r"]').value;
      if(!w) return;
      rows.push({ user_id:user.id, log_date:date, day_key:day, exercise:e.zh,
                  set_no:n+1, weight:parseFloat(w), reps: r ? parseInt(r,10) : null });
    });
  });
  if(!rows.length){ toast("還沒填任何重量"); return; }

  setStat("儲存中…","busy");
  const err = await writeSession(date, day, rows);
  if(err){
    if(isNetErr(err)){ queuePending(date, day, rows); return; }
    setStat("儲存失敗","bad"); showBanner("儲存失敗："+err.message); return;
  }

  // this save supersedes any queued offline copy of the same date/day
  setPending(getPending().filter(p => !(p.date === date && p.day === day)));
  $("banner").hidden = true;
  toast("已儲存 "+date);
  await loadDay(day);
  loadWeek();
}

/* ---------- 分享戰績：把最近一次訓練變成一段超燃文字 ---------- */
let weekCount = 0;
const QUOTES = [
  "你今天流的汗，是明天的底氣。",
  "重量不會騙人，練過的每一組都算數。",
  "比昨天的自己多推 2.5kg，就是勝利。",
  "肌肉是熬出來的，強者是練出來的。",
  "沒有奇蹟，只有累積。",
  "今天不想練？練完你就不這麼想了。",
];

/* 分享的是「訓練日期」欄選到的那天；delta 跟該天的前一次比 */
function buildShareData(date){
  const idx = state[day].findIndex(s=>s.date===date);
  if(idx < 0) return null;
  const s = state[day][idx];
  const prev = idx > 0 ? state[day][idx-1] : null;
  const rows = exList(day).map((e,i)=>{
    const b = bestOf(s.data[i]);
    if(!b) return null;
    const pb = prev ? bestOf(prev.data[i]) : null;
    let tag = "";
    if(pb){
      const diff = parseFloat(b.w) - parseFloat(pb.w);
      tag = diff>0 ? "進化了！+"+(+diff.toFixed(1))+"kg 🔺" : diff===0 ? "穩住 💪" : "";
    } else tag = "首次解鎖 ✨";
    return {zh:e.zh, w:b.w, r:b.r||"?", tag};
  }).filter(Boolean);
  if(!rows.length) return null;
  return {d:DAYS[day], date, rows, quote:QUOTES[Math.floor(Math.random()*QUOTES.length)]};
}

function shareText(sd){
  return [
    sd.d.mo+" "+sd.date+"　"+sd.d.name+"日訓練完成",
    "",
    ...sd.rows.map(r=>"• "+r.zh+" "+r.w+"kg × "+r.r+(r.tag?"（"+r.tag+"）":"")),
    // weekCount is 0 until loadWeek() succeeds — drop the line rather than share a wrong 0/3
    ...(weekCount ? ["", "本週 "+weekCount+" / 3"] : []),
    "",
    "「"+sd.quote+"」",
    "",
    "— PPL 訓練記錄",
  ].join("\n");
}

/* 1080px 寬的戰績卡：跟主介面同一套視覺：牛皮紙底、hairline、近黑墨數字、綠色＝進步 */
function shareImage(sd){
  // Console tokens as hex (canvas in older Safari rejects oklch); keep in step with :root
  const dc="#14110F", BG="#F5F1EA", INK="#14110F", MUTED="#58514C", RULE="#DBD7CE", OK="#246E3A";
  const W=1080, PAD=88, rowH=132, top=330;
  const H = top + sd.rows.length*rowH + (weekCount?110:0) + 300;
  const c = document.createElement("canvas"); c.width=W; c.height=H;
  const x = c.getContext("2d");
  const F = (w,s)=> w+" "+s+'px system-ui,"PingFang TC","Noto Sans TC",sans-serif';
  const M = (w,s)=> w+" "+s+'px "Red Hat Display",system-ui,"PingFang TC",sans-serif';
  const fit = (t,max,f)=>{ x.font=f; while(x.measureText(t).width>max && t.length>2) t=t.slice(0,-2)+"…"; return t; };

  x.fillStyle=BG; x.fillRect(0,0,W,H);
  x.fillStyle=dc; x.fillRect(0,0,W,10);

  x.fillStyle=MUTED; x.font=M(700,26);
  x.fillText("PPL 訓練記錄", PAD, 96);
  x.textAlign="right"; x.fillText(sd.date, W-PAD, 96); x.textAlign="left";
  x.fillStyle=INK; x.font=F(800,76);
  x.fillText(sd.d.mo+" "+sd.d.name+"日訓練完成", PAD, 208);
  x.fillStyle=MUTED; x.font=F(600,30);
  x.fillText(sd.d.en+" · "+sd.d.groups, PAD, 262);

  let y = top;
  sd.rows.forEach(r=>{
    x.fillStyle=RULE; x.fillRect(PAD, y, W-2*PAD, 1);
    x.fillStyle=INK; x.font=F(600,36);
    x.fillText(fit(r.zh, W-2*PAD-380, F(600,36)), PAD, y+56);
    const v = r.w+" kg × "+r.r;
    x.font=M(800,50); const vw = x.measureText(v).width;
    x.fillStyle=dc; x.fillText(v, PAD, y+112);
    if(r.tag){ x.fillStyle = r.tag.includes("進化") ? OK : MUTED;
      x.font=F(700,27); x.fillText(r.tag, PAD+vw+26, y+106); }
    y += rowH;
  });
  x.fillStyle=RULE; x.fillRect(PAD, y, W-2*PAD, 1);

  y += 46;
  if(weekCount){
    x.fillStyle=MUTED; x.font=F(700,32);
    x.fillText("本週", PAD, y+34);
    x.fillStyle=INK; x.font=M(800,40);
    x.fillText(weekCount+" / 3", PAD+96, y+36);
    // three progress ticks, filled in the day color
    for(let i=0;i<3;i++){ x.fillStyle = i<weekCount ? dc : RULE;
      const bx = PAD+240+i*66;
      x.beginPath(); x.roundRect(bx, y+10, 52, 14, 7); x.fill(); }
    y += 110;
  }
  x.fillStyle=INK; x.font=F(600,38);
  x.fillText(fit("「"+sd.quote+"」", W-2*PAD, F(600,38)), PAD, y+48);
  x.fillStyle=MUTED; x.font=M(700,26);
  x.fillText("— PPL 訓練記錄", PAD, y+120);
  return c;
}

$("share").onclick = async ()=>{
  const date = $("date").value || todayStr();
  const sd = buildShareData(date);
  if(!sd){ toast(date+" 沒有"+DAYS[day].name+"日紀錄，先選一個練過的日期"); return; }

  let copied = false;
  try{ await navigator.clipboard.writeText(shareText(sd)); copied = true; }catch(e){}

  const blob = await new Promise(res => shareImage(sd).toBlob(res, "image/png"));
  const file = new File([blob], "ppl-"+date+".png", {type:"image/png"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    if(copied) toast("戰績文字已複製，圖片拿去傳！");
    try{ await navigator.share({files:[file]}); }catch(e){ /* user cancelled the sheet */ }
    return;
  }
  // ponytail: desktop fallback — download the card instead of a share sheet
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
  URL.revokeObjectURL(a.href);
  if(copied) toast("文字已複製、圖片已下載");
  else { toast("圖片已下載"); showBanner(shareText(sd)); }
};

  $("list").querySelectorAll("input").forEach(i=>{ if(i.dataset.f==="w") i.value=""; });
  exList(day).forEach((_,i)=>updateDelta(i));
  toast("已清空輸入欄");
};

/* ---------- 畫面 ---------- */
function renderTabs(){
  $("tabs").innerHTML = Object.entries(DAYS).map(([k,d])=>
    '<button class="tab" role="tab" data-day="'+k+'" aria-selected="'+(k===day)+'">'+
    d.en[0]+d.en.slice(1).toLowerCase()+'</button>').join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>{
    b.onclick = ()=>switchDay(b.dataset.day);
  });
}

async function switchDay(k){
  if(k === day) return;
  day = k; ready = false; render();
  window.scrollTo({top:0, behavior:"smooth"});
  await loadDay(day);
}

/* 左右滑動切換分項；起點避開螢幕邊緣（iOS 的返回手勢區） */
const DAY_KEYS = ["A","B","C"];
let swX = null, swY = 0;
window.addEventListener("touchstart", e=>{
  const t = e.touches[0];
  swX = (t.clientX > 24 && t.clientX < innerWidth-24) ? t.clientX : null;
  swY = t.clientY;
}, {passive:true});
window.addEventListener("touchend", e=>{
  if(swX == null) return;
  const t = e.changedTouches[0], dx = t.clientX - swX, dy = t.clientY - swY;
  swX = null;
  if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return;
  const i = DAY_KEYS.indexOf(day);
  switchDay(DAY_KEYS[(i + (dx < 0 ? 1 : 2)) % 3]);
}, {passive:true});
/* the session being edited, if the selected 訓練日期 was already saved */
function curSession(){
  const sel = $("date").value || todayStr();
  return (state[day]||[]).find(s=>s.date===sel) || null;
}
function bestOf(sets){
  const v=(sets||[]).filter(s=>s&&s.w); if(!v.length) return null;
  return v.reduce((a,b)=> parseFloat(b.w)>parseFloat(a.w)?b:a);
}
/* 每個動作各自往回找最近一次有做的紀錄——上次跳過蝴蝶機，不該退回「試重量」。
   多回傳 date / stale（不是最近一次訓練時為 true，UI 標出是哪天的）
   與 earned（三組都做滿 REP_GOAL 下 = 這次加重是賺到的，見 setTargets）。 */
function lastBest(i){
  const sel = $("date").value || todayStr();
  const before = (state[day]||[]).filter(s=>s.date<sel);
  for(let k=before.length-1; k>=0; k--){
    const sets = (before[k].data[i]||[]).filter(x=>x&&x.w);
    if(!sets.length) continue;
    // 最重那組；同重量取次數最多的——他可能升序做 6→8→10，那組 10 下才是真實能力
    const b = sets.reduce((x,y)=>{
      const d = parseFloat(y.w) - parseFloat(x.w);
      return d>0 || (d===0 && (parseFloat(y.r)||0) > (parseFloat(x.r)||0)) ? y : x;
    });
    return {...b, date: before[k].date, stale: k < before.length-1,
            earned: sets.length>=3 && sets.every(x=>parseFloat(x.r)>=REP_GOAL)};
  }
  return null;
}

/* Progress sparkline: best-set weight per session, last 10 sessions.
   Single series in the ink; last point direct-labeled; dots carry
   native <title> tooltips. Needs >=2 sessions to be a trend. */
function sparkline(i){
  const pts = state[day]
    .map(s => ({d: s.date, b: bestOf(s.data[i])}))
    .filter(p => p.b)
    .map(p => ({d: p.d, w: parseFloat(p.b.w)}))
    .slice(-10);
  if(pts.length < 2) return "";
  const W=280, H=56, PX=6, PY=10;
  const min = Math.min(...pts.map(p=>p.w)), max = Math.max(...pts.map(p=>p.w));
  const x = k => PX + k*(W-2*PX)/(pts.length-1);
  const y = w => max===min ? H/2 : PY + (H-2*PY)*(1-(w-min)/(max-min));
  const last = pts[pts.length-1];
  /* preserveAspectRatio=none + non-scaling strokes: the line stretches to the card,
     stroke and dot sizes stay constant; dots are zero-length round-cap segments */
  return '<div class="sparkrow"><svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
    'role="img" aria-label="'+esc(exList(day)[i].zh)+' 重量趨勢，最近 '+pts.length+' 次">'+
    '<path d="'+pts.map((p,k)=>(k?"L":"M")+x(k).toFixed(1)+","+y(p.w).toFixed(1)).join(" ")+'"'+
    ' stroke="var(--color-ink)" stroke-width="2" vector-effect="non-scaling-stroke" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'+
    pts.map((p,k)=>'<path d="M'+x(k).toFixed(1)+','+y(p.w).toFixed(1)+' h0.01"'+
      ' stroke="var(--color-ink)" stroke-width="6" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none">'+
      '<title>'+p.d+'　'+p.w+' kg</title></path>').join("")+
    '</svg><span class="sparklabel" style="top:'+Math.round(y(last.w)/H*52-6)+'px">'+last.w+'kg</span></div>';
}

/* 雙重漸進 + 次數換算重量。重量不會自己往上爬，而且會雙向修正：
   先用 Epley（e1RM = w(1+r/30)）把上次頂組換算成「做得到 REP_GOAL 下」的重量，
   再在三組都做滿時多加一片。係數 = (30+上次次數)/40，所以
     13 下 → ×1.075（多賺）   10 下 → ×1.0（照常晉級）
      9 下 → ×0.975（重做）    6 下 → ×0.90（降一片）
   6 下剛好落在 90%，和 StrongLifts / Starting Strength 的 10% deload 幾乎一致，
   只是一次到位、不用連續失敗三次——他一個分項一週才練一次，等不起三週。
   ramp：三組各差一片，頂組就是目標，所以第一組本來就輕（專項熱身）。
   ponytail: Epley 在 10 下附近已是驗證邊緣、器械又比槓鈴不準，它是合理插值
   不是精密測量；真要更準得記 RIR，但那是刻意不做的（見 CONTEXT.md）。 */
const REP_GOAL = 10;
const TARGET_STEP = 2.5;
const round25 = w => +(Math.round(w/2.5)*2.5).toFixed(1);
const equiv = (w,r) => r ? w*(30+r)/(30+REP_GOAL) : w;   // 次數沒填就不要憑空動重量
const topTarget = p => round25(equiv(parseFloat(p.w), parseFloat(p.r))
                               + (p.earned ? TARGET_STEP : 0));
const setTargets = T => [Math.max(TARGET_STEP, T-2*TARGET_STEP),
                         Math.max(TARGET_STEP, T-TARGET_STEP), T];
const targetOf = p => p ? topTarget(p) : null;

/* 一句話交代重量為什麼動了（或為什麼沒動）。比較 T 與上次頂組就夠分三種情況 */
const whyText = (p, T) =>
    T > +p.w ? '上次 '+p.w+' kg 做到 '+p.r+' 下，進到 '+T+' kg'
  : T < +p.w ? '上次 '+p.w+' kg 只到 '+p.r+' 下，先降到 '+T+' kg 做滿'
  :            '維持 '+p.w+' kg，三組各 '+REP_GOAL+' 下就晉級';

/* 今天的目標清單 — the first thing on screen */
function renderGoals(){
  $("goals").innerHTML = exList(day).map((e,i)=>{
    const p = ready ? lastBest(i) : null, t = targetOf(p);
    return '<button class="grow" data-i="'+i+'"><span class="gmark" aria-hidden="true">✓</span>'+
      '<span class="gname">'+esc(e.zh)+'<span class="sr-only" data-sr></span></span>'+
      '<span class="glast">'+(p ? p.w+'<span class="sr-only"> kg 上次</span>' : '')+'</span>'+
      '<span class="gtarget">'+(t!=null ? t+'<small>kg</small>' : (ready ? '試重量' : '…'))+'</span></button>';
  }).join("");
  $("goals").querySelectorAll(".grow").forEach(b=>{
    b.onclick = ()=>{ const el = $("list").children[b.dataset.i];
      if(!el) return;
      el.classList.remove("fold");
      el.scrollIntoView({behavior:"smooth", block:"start"});
      const w = el.querySelector('input[data-f="w"]');
      if(w) w.focus({preventScroll:true});
    };
  });
}

function render(){
  const d = DAYS[day];
  // 只有看「今天該練的分項」時才宣稱「今天」
  $("pagetitle").textContent = day === autoDay ? "今天的目標" : d.name+"日的目標";
  renderTabs();
  if(!ready){ $("list").innerHTML = '<div class="loading">載入中…</div>'; renderGoals(); return; }
  const cur = curSession();

  $("list").innerHTML = exList(day).map((e,i)=>{
    const p = lastBest(i);
    const ramp = p ? setTargets(topTarget(p)) : null;
    const bigTxt = p
      ? '<div class="big"><span class="glabel">目標</span><span class="w">'+ramp[2]+'<small>kg</small></span>'+
        '<span class="delta" data-i="'+i+'">今天？</span></div>'+
        '<div class="sub">'+whyText(p, ramp[2])+
        (p.stale ? '<span>（'+p.date.slice(5)+'）</span>' : '')+'</div>'
      : '<div class="big"><span class="glabel">目標</span><span class="w w-none">試重量</span></div>'+
        '<div class="sub">尚無紀錄，先試出一個做得完 '+REP_GOAL+' 下的重量</div>';
    return '<div class="ex"><div class="ex-h">'+ICONS[e.icon]+
      '<div class="ex-t"><div class="ex-top"><div><div class="ex-zh">'+esc(e.zh)+'</div>'+
      (e.en?'<div class="ex-en">'+e.en+'</div>':'')+'</div>'+
      (e.target?'<div class="ex-target">'+e.target+'</div>':'')+'</div>'+
      (e.id?'<div class="ex-id">'+e.id+'</div>':'')+'</div></div>'+
      '<div class="reading">'+bigTxt+sparkline(i)+'</div>'+
      '<div class="col-h"><span></span><span>重量</span><span>次數</span></div><div class="sets">'+
      [1,2,3].map(n=>{
        const cs = cur && cur.data[i] ? cur.data[i][n-1] : null;   // saved set for the selected date
        return '<div class="set"><div class="set-n">'+n+'</div>'+
        '<div class="field"><input type="number" inputmode="decimal" step="0.5" min="0" placeholder="'+
          (ramp?ramp[n-1]:"")+'"'+(cs&&cs.w?' value="'+cs.w+'"':'')+' data-ex="'+i+'" data-set="'+(n-1)+'" data-f="w"><span class="u">kg</span></div>'+
        '<div class="field"><input type="number" inputmode="numeric" step="1" min="0" value="'+
          (cs&&cs.r?cs.r:"10")+'" data-ex="'+i+'" data-set="'+(n-1)+'" data-f="r"><span class="u">下</span></div>'+
        '</div>';}).join("")+'</div>'+
      '<div class="done" data-i="'+i+'"></div>'+
      (e.alt.length?'<details class="alt"><summary>找不到這台？替代動作</summary><div class="alt-body"><ul>'+
      e.alt.map(a=>'<li>'+a+'</li>').join("")+'</ul><div class="why">'+e.why+'</div></div></details>':'<div class="padend"></div>')+'</div>';
  }).join("");

  $("list").querySelectorAll("input[data-f='w']").forEach(inp=>{
    inp.addEventListener("input", ()=>updateDelta(inp.dataset.ex));
    inp.addEventListener("change", ()=>{ if(!inp.value) return; startRest();
      const card = $("list").children[inp.dataset.ex];
      const filled = [...card.querySelectorAll('input[data-f="w"]')].every(x=>x.value);
      if(filled) card.classList.add("fold");   // done → collapse; header tap re-opens
    });
  });
  // 次數也要重算：達標判定看的是次數，不是只有重量
  $("list").querySelectorAll("input[data-f='r']").forEach(inp=>{
    inp.addEventListener("input", ()=>updateDelta(inp.dataset.ex));
  });
  $("list").querySelectorAll(".ex-h").forEach(h=>{ h.onclick = ()=>h.parentElement.classList.toggle("fold"); });
  renderGoals();
  if(cur) exList(day).forEach((_,i)=>updateDelta(i));  // reflect the saved session in chips and goal checks
  renderHist();
  renderEdit();
}

/* ---------- Edit the exercise list: hide defaults, add/remove customs ---------- */
function renderEdit(){
  const p = prefs[day] || (prefs[day] = {hidden:[], custom:[]});
  $("editbody").innerHTML =
    DAYS[day].ex.map(e =>
      '<label class="editrow"><input type="checkbox" data-zh="'+esc(e.zh)+'"'+
      ((p.hidden||[]).includes(e.zh)?'':' checked')+'> '+esc(e.zh)+'</label>').join("")+
    (p.custom||[]).map(zh =>
      '<div class="editrow">'+esc(zh)+'（自訂）<button class="rm btn-s" data-zh="'+esc(zh)+'">移除</button></div>').join("")+
    '<div class="addrow"><input id="newex" maxlength="20" placeholder="新增自訂動作，如：腿內收機">'+
    '<button class="btn-p" id="addex">新增</button></div>';

  $("editbody").querySelectorAll('input[type="checkbox"]').forEach(cb=>{
    cb.onchange = async ()=>{
      const zh = cb.dataset.zh;
      p.hidden = cb.checked ? (p.hidden||[]).filter(x=>x!==zh) : [...(p.hidden||[]), zh];
      await savePrefs(); await loadDay(day);
    };
  });
  $("editbody").querySelectorAll(".rm").forEach(b=>{
    b.onclick = async ()=>{
      p.custom = (p.custom||[]).filter(x=>x!==b.dataset.zh);
      await savePrefs(); await loadDay(day);   // logged sets stay in the DB, just not shown
    };
  });
  $("addex").onclick = async ()=>{
    const zh = $("newex").value.trim();
    if(!zh) return;
    if(DAYS[day].ex.some(e=>e.zh===zh) || (p.custom||[]).includes(zh)){ toast("已經有這個動作了"); return; }
    p.custom = [...(p.custom||[]), zh];
    await savePrefs(); await loadDay(day);
  };
}

/* 今天這個動作有沒有賺到下次的加重：三組都填、且每組都做滿 REP_GOAL 下 */
function earnedToday(i){
  const rows = [0,1,2].map(n=>({
    w: parseFloat(($("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="w"]')||{}).value),
    r: parseFloat(($("list").querySelector('input[data-ex="'+i+'"][data-set="'+n+'"][data-f="r"]')||{}).value)
  }));
  return rows.every(x => !isNaN(x.w) && x.r >= REP_GOAL);
}

function updateDelta(i){
  const vals=[...$("list").querySelectorAll('input[data-ex="'+i+'"][data-f="w"]')]
    .map(x=>parseFloat(x.value)).filter(v=>!isNaN(v));
  // goal check = all three sets logged (done), not "beat last time" — the delta chip carries that verdict.
  // 先打勾再管差異標籤：沒有歷史紀錄的動作根本沒有 .delta，不能因此跳過打勾
  const goal = $("goals").querySelector('.grow[data-i="'+i+'"]');
  if(goal){ const hit = vals.length >= 3;
    goal.classList.toggle("hit", hit);
    const sr = goal.querySelector("[data-sr]"); if(sr) sr.textContent = hit ? "（已完成）" : ""; }
  const done = $("list").querySelector('.done[data-i="'+i+'"]');
  if(done){ const ok = earnedToday(i);
    done.textContent = ok ? "達標！三組滿 "+REP_GOAL+" 下，下次 +"+TARGET_STEP+" kg" : "";
    done.classList.toggle("show", ok); }
  const chip = $("list").querySelector('.delta[data-i="'+i+'"]'); if(!chip) return;
  const p = lastBest(i); if(!p) return;
  if(!vals.length){ chip.className="delta"; chip.textContent="今天？"; return; }
  const diff = Math.max(...vals) - parseFloat(p.w);
  // 第一組本來就該比上次輕（熱身組），三組填完前不要判「退步」——那是設計好的 ramp，不是退步
  if(diff<0 && vals.length<3){ chip.className="delta"; chip.textContent="進行中"; return; }
  // 上次沒做滿、App 自己把目標調低時，照著做也不是退步
  if(diff<0 && Math.max(...vals) >= topTarget(p)){
    chip.className="delta same"; chip.textContent="照表操課"; return; }
  if(diff>0){ chip.className="delta up"; chip.textContent="↑ +"+(+diff.toFixed(1)); }
  else if(diff===0){ chip.className="delta same"; chip.textContent="持平"; }
  else { chip.className="delta down"; chip.textContent="↓ "+(+diff.toFixed(1)); }
}

function renderHist(){
  const arr=[...state[day]].reverse().slice(0,6);
  if(!arr.length){ $("hist").innerHTML='<div class="empty">還沒有 Day '+day+' 的紀錄。</div>'; return; }
  $("hist").innerHTML = arr.map(s=>{
    const lines = exList(day).map((e,i)=>{
      const sets=(s.data[i]||[]).filter(x=>x&&x.w).map(x=>x.w+"×"+(x.r||"?")).join("  ");
      return sets ? esc(e.zh)+" &nbsp;"+sets : null;
    }).filter(Boolean);
    return '<div class="hist-item"><div class="d">'+s.date+'</div>'+lines.join("<br>")+'</div>';
  }).join("");
}
</script>
