<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設計稿：樸素</title>
<style>
  :root{
    --bg:#FFFFFF; --ink:#111111; --dim:#6B6B6B; --faint:#A8A8A8; --line:#EBEBEB; --box:#F5F5F5;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;
       line-height:1.5;padding:0 0 96px}
  .wrap{max-width:440px;margin:0 auto;padding:0 20px}

  header{padding:20px 0 14px;display:flex;justify-content:space-between;align-items:center}
  h1{font-size:17px;font-weight:700;margin:0}
  .datebtn{font-size:14px;color:var(--dim);background:var(--box);border:none;border-radius:8px;padding:8px 12px}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--box);border-radius:10px;padding:3px;gap:2px}
  .seg button{border:none;background:none;border-radius:8px;padding:10px 0;font-size:15px;font-weight:600;
       color:var(--dim);font-family:inherit}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

  .row{padding:20px 0;border-bottom:1px solid var(--line)}
  .row-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .name{font-size:16px;font-weight:700}
  .target{font-size:12px;color:var(--faint)}
  .last{font-size:13px;color:var(--dim);margin:4px 0 12px}
  .last b{color:var(--ink);font-weight:600}
  .delta{color:#0A7A43;font-weight:600;margin-left:8px;font-size:13px}

  .sets{display:grid;gap:8px}
  .set{display:grid;grid-template-columns:20px 1fr 1fr;gap:10px;align-items:center}
  .set-n{font-size:12px;color:var(--faint);text-align:center}
  .bx{position:relative}
  .bx input{width:100%;background:var(--box);border:none;border-radius:10px;height:52px;
       padding:0 40px 0 14px;font-size:18px;color:var(--ink);font-family:inherit}
  .bx input:focus{outline:2px solid var(--ink);background:#fff}
  .bx input::placeholder{color:#C4C4C4}
  .bx .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--faint)}

  .meta{display:flex;gap:16px;margin-top:10px;font-size:12.5px}
  .meta a{color:var(--dim)}

  .hist{padding:22px 0}
  .hist h2{font-size:13px;color:var(--faint);font-weight:600;margin:0 0 10px}
  .hist-item{font-size:13px;color:var(--dim);padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:12px}
  .hist-item .d{color:var(--faint);white-space:nowrap}

  .savebar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
       padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .savebar .inner{max-width:400px;margin:0 auto;display:flex;gap:10px}
  button.save{flex:1;background:var(--ink);color:#fff;border:none;border-radius:10px;padding:15px;
       font-size:16px;font-weight:700;font-family:inherit}
  button.ghost{background:none;color:var(--dim);border:1px solid var(--line);border-radius:10px;
       padding:15px 16px;font-size:14px;font-family:inherit}

  .timer{position:fixed;right:16px;bottom:88px;background:var(--ink);color:#fff;border-radius:999px;
       padding:10px 16px;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>訓練記錄</h1>
    <button class="datebtn">8/12（三）</button>
  </header>

  <div class="seg">
    <button class="on">推</button>
    <button>拉</button>
    <button>腿</button>
  </div>

  <div class="row">
    <div class="row-h"><span class="name">胸推機</span><span class="target">3 × 10–12</span></div>
    <div class="last">上次 <b>20 kg × 10</b><span class="delta">+2.5</span></div>
    <div class="sets">
      <div class="set"><span class="set-n">1</span>
        <div class="bx"><input inputmode="decimal" value="22.5"><span class="u">kg</span></div>
        <div class="bx"><input inputmode="numeric" value="10"><span class="u">下</span></div>
      </div>
      <div class="set"><span class="set-n">2</span>
        <div class="bx"><input inputmode="decimal" placeholder="20"><span class="u">kg</span></div>
        <div class="bx"><input inputmode="numeric" value="10"><span class="u">下</span></div>
      </div>
      <div class="set"><span class="set-n">3</span>
        <div class="bx"><input inputmode="decimal" placeholder="20"><span class="u">kg</span></div>
        <div class="bx"><input inputmode="numeric" value="10"><span class="u">下</span></div>
      </div>
    </div>
    <div class="meta"><a href="#">認機器</a><a href="#">替代動作</a><a href="#">進度</a></div>
  </div>

  <div class="row">
    <div class="row-h"><span class="name">肩推機</span><span class="target">3 × 10–12</span></div>
    <div class="last">上次 <b>25 kg × 10</b></div>
    <div class="sets">
      <div class="set"><span class="set-n">1</span>
        <div class="bx"><input inputmode="decimal" placeholder="25"><span class="u">kg</span></div>
        <div class="bx"><input inputmode="numeric" value="10"><span class="u">下</span></div>
      </div>
    </div>
    <div class="meta"><a href="#">認機器</a><a href="#">替代動作</a><a href="#">進度</a></div>
  </div>

  <div class="hist">
    <h2>歷史</h2>
    <div class="hist-item"><span class="d">8/10</span><span>胸推機 20×10 · 肩推機 25×10 · 蝴蝶機 20×10</span></div>
    <div class="hist-item"><span class="d">8/6</span><span>胸推機 20×10 · 肩推機 22.5×10</span></div>
  </div>
</div>

<div class="timer">0:52</div>
<div class="savebar"><div class="inner">
  <button class="save">儲存</button>
  <button class="ghost">清空</button>
</div></div>
</body>
</html>
